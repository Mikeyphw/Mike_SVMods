[targets.letmehatch.validation]
memory_guard_mb = 0
max_workers = 4
cpu_limit = 4
low_priority = false

[targets.letmehatch.env]
DOTNET_ROLL_FORWARD = "Major"

[targets.letmehatch.workflows]

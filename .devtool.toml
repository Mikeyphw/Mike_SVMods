[targets.svmods.jobs.ci-source]
root = ".."
runner = "command"
command = ["python3", "scripts/devtool_actions_contract.py"]
inputs = [".devtool.toml", "scripts/devtool_actions_contract.py", ".github/workflows/*.yml"]
outputs = []
[targets.svmods.jobs.ci-source.metadata]
read_only = true

[wrapper]
schema = 2
default_command = "ci-preflight"

[wrapper.commands.ci-preflight]
description = "Read-only .NET CI contract verification"
workflow = "ci-preflight"
target = "svmods"

[wrapper.commands.ci-local]
description = "Reuse existing .NET purity and test solution DAG"
workflow = "ci-local"
target = "svmods"

[wrapper.commands.ci-letmehatch]
description = "Run LetMeHatch existing DAG"
workflow = "validate"
target = "letmehatch"

[targets.nestcore.workflows]
ownership-probe = [{id = "source", ref = "job:target-ownership-contract", depends_on = []}]

[targets.roostercontrol_pure.workflows]
ownership-probe = [{id = "source", ref = "job:target-ownership-contract", depends_on = []}]

[targets.pure.workflows]
ownership-graph = [
  {id = "dep_roostercontrol_pure", ref = "target:roostercontrol_pure#ownership-probe", depends_on = []},
]

[targets.embed_tool.workflows]
ownership-probe = [{id = "source", ref = "job:target-ownership-contract", depends_on = []}]

[jobs.target-ownership-contract]
runner = "command"
root = "."
command = ["python3", "scripts/devtool_target_ownership.py", "--json"]
inputs = [".devtool.toml", "scripts/devtool_target_ownership.py"]
outputs = []

[jobs.target-ownership-contract.metadata]
read_only = true

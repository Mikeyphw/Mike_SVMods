    {id = "animalnotes", ref = "job:eggsinwild-animalnotes-tests", depends_on = []},
    {id = "unit", ref = "job:eggsinwild-tests", depends_on = []},
    {id = "phase7", ref = "job:eggsinwild-phase7-tests", depends_on = []},

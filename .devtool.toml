# Mike_SVMods — Devtool configuration
# Repository standardized on .NET 6.

[project]
runner = "dotnet"
platform = "desktop"

[workspace]
default_target = "svmods"

[workspace.groups]
mods = ["nestcore", "letmehatch", "eggsinwild", "roostercontrol"]
tests = ["roostercontrol_pure", "pure"]
tools = ["embed_tool"]
all = ["svmods", "@mods", "@tests", "@tools"]

[workspace.scheduler]
parallel = true
max_parallel_nodes = 3
max_dotnet_nodes = 2
max_gradle_nodes = 1
[execution]
environment = "auto"


# ============================================================
# Canonical repository validation
# ============================================================
#
# Tests/run-tests.sh is the repository's authoritative test entry point:
#   1. LetMeHatch/Tools/validate-core.sh
#   2. dotnet test Tests/Tests.sln -c Release
#
# solution/test_target are also declared so Devtool can resolve the
# .NET target before dispatching the custom test command.

[targets.svmods]
runner = "dotnet"
platform = "desktop"
root = "Tests"
solution = "Tests/Tests.sln"
test_target = "Tests/Tests.sln"
test_command = "./run-tests.sh"
inputs = [
    "../.devtool.toml",
    "../Directory.Build.props",
    "../Directory.Build.targets",
    "../Mike_SVMods.sln",
    "../scripts/**",
    "../.github/workflows/**",
]
outputs = [
    "**/bin/**",
    "**/obj/**",
]

[targets.svmods.validation]
memory_guard_mb = 0
max_workers = 4
cpu_limit = 4
low_priority = false



# ============================================================
# Per-project validation targets
# ============================================================
#
# Use these for fast iteration on one mod. The aggregate `svmods`
# target remains the canonical repository-wide integration/final gate.

[targets.svmods.workflows]
validate = [
    {id = "core_purity", ref = "job:core_purity", depends_on = []},
    {id = "tests_sln", ref = "job:tests_sln", depends_on = ["core_purity"]},
]
ci-preflight = [
  { id = "source", ref = "job:ci-source", depends_on = [] },
]
ci-local = [
  { id = "source", ref = "job:ci-source", depends_on = [] },
  { id = "core", ref = "job:core_purity", depends_on = ["source"] },
  { id = "tests", ref = "job:tests_sln", depends_on = ["core"] },
]
ownership-graph = [
  {id = "dep_nestcore", ref = "target:nestcore#ownership-probe", depends_on = []},
  {id = "dep_letmehatch", ref = "target:letmehatch#ownership-graph", depends_on = []},
  {id = "dep_eggsinwild", ref = "target:eggsinwild#ownership-graph", depends_on = []},
  {id = "dep_roostercontrol", ref = "target:roostercontrol#ownership-graph", depends_on = []},
  {id = "dep_roostercontrol_pure", ref = "target:roostercontrol_pure#ownership-probe", depends_on = []},
  {id = "dep_pure", ref = "target:pure#ownership-graph", depends_on = []},
  {id = "dep_embed_tool", ref = "target:embed_tool#ownership-probe", depends_on = []},
]


ci-hosted-dotnet = [
  {id = "source", ref = "job:ci-source", depends_on = []},
  {id = "restore_pure", ref = "job:r06b_restore_pure", depends_on = ["source"]},
  {id = "test_pure", ref = "job:r06b_test_pure", depends_on = ["restore_pure"]},
  {id = "restore_animal", ref = "job:r06b_restore_animal", depends_on = ["test_pure"]},
  {id = "test_animal", ref = "job:r06b_test_animal", depends_on = ["restore_animal"]},
]

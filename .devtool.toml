test_command = "./Tests/devtool/validate-eggsinwild.sh"
inputs = [
    "EggsInWild/**",
    "Tests/EggsInWild*/**",
    ".devtool.toml",
]
outputs = [
    "EggsInWild/bin/**",
    "EggsInWild/obj/**",
    "Tests/EggsInWild*/**/bin/**",
    "Tests/EggsInWild*/**/obj/**",
]

[targets.eggsinwild.validation]
memory_guard_mb = 0
max_workers = 4
cpu_limit = 4
low_priority = false

[targets.eggsinwild.env]
GamePath = "/data/data/com.termux/files/home/stardew/game"
DOTNET_ROLL_FORWARD = "Major"

[targets.eggsinwild.workflows]

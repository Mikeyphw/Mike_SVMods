    "../Directory.Build.props",
    "../Directory.Build.targets",
    "../.github/workflows/**",
    "../Tests/LetMeHatch.Core.Tests/**",
    "../Tests/LetMeHatch.Tests/**",
]
outputs = [
    "bin/**",
    "obj/**",
    "../Tests/LetMeHatch.Core.Tests/bin/**",
    "../Tests/LetMeHatch.Core.Tests/obj/**",
    "../Tests/LetMeHatch.Tests/bin/**",
    "../Tests/LetMeHatch.Tests/obj/**",

# ============================================================
# .NET policy
# ============================================================

[dotnet]
configuration = "Release"

# dotnet test already performs restore/build when required.
coalesce_validation = true
explicit_restore = false

# Reuse MSBuild servers between invocations.
stop_after_run = false


# ============================================================
# Host resource policy
# ============================================================

[build]
max_workers = 4

[targets.svmods.env]
DOTNET_ROLL_FORWARD = "Major"

[jobs.svmods-core-purity]
runner = "command"
root = "."
command = ["./LetMeHatch/Tools/validate-core.sh"]
inputs = [
    "LetMeHatch/Core/**",
    "LetMeHatch/Tools/validate-core.sh",
]
outputs = []

[jobs.svmods-core-purity.env]
DOTNET_ROLL_FORWARD = "Major"

[jobs.svmods-tests-sln]
runner = "command"
root = "."
command = ["dotnet", "test", "Tests/Tests.sln", "-c", "Release"]
inputs = [
    "Tests/**",
    "LetMeHatch/**",
    "EggsInWild/**",
    "RoosterControl/**",
    "NestCore/**",
]
outputs = ["Tests/**/bin/**", "Tests/**/obj/**"]

[jobs.svmods-tests-sln.env]
DOTNET_ROLL_FORWARD = "Major"

[jobs.letmehatch-core-purity]
runner = "command"
root = "."
command = ["./LetMeHatch/Tools/validate-core.sh"]
inputs = [
    "LetMeHatch/Core/**",
    "LetMeHatch/Tools/validate-core.sh",
]

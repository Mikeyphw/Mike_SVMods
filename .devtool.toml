# Mike_SVMods — Devtool configuration
# Repository standardized on .NET 6.

[project]
runner = "dotnet"
platform = "desktop"

[workspace]
default_target = "svmods"

[workspace.groups]
mods = ["nestcore", "letmehatch", "eggsinwild", "roostercontrol"]
tests = ["roostercontrol_pure", "pure"]
tools = ["embed_tool"]
all = ["svmods", "@mods", "@tests", "@tools"]

[workspace.scheduler]
parallel = true
max_parallel_nodes = 3
max_dotnet_nodes = 2
max_gradle_nodes = 1
[execution]
environment = "native-termux"


# ============================================================
# Canonical repository validation
# ============================================================
#
# Tests/run-tests.sh is the repository's authoritative test entry point:
#   1. LetMeHatch/Tools/validate-core.sh
#   2. dotnet test Tests/Tests.sln -c Release
#
# solution/test_target are also declared so Devtool can resolve the
# .NET target before dispatching the custom test command.

[targets.svmods]
runner = "dotnet"
platform = "desktop"
root = "."
solution = "Tests/Tests.sln"
test_target = "Tests/Tests.sln"
test_command = "./Tests/run-tests.sh"
inputs = [
    ".devtool.toml",
    "Tests/**",
    "LetMeHatch/**",
    "EggsInWild/**",
    "RoosterControl/**",
    "NestCore/**",
    "Shared/**",
    "*.sln",
    "*.props",
    "*.targets",
]
outputs = [
    "**/bin/**",
    "**/obj/**",
]

[targets.svmods.validation]
memory_guard_mb = 0
max_workers = 4
cpu_limit = 4
low_priority = false



# ============================================================
# Per-project validation targets
# ============================================================
#
# Use these for fast iteration on one mod. The aggregate `svmods`
# target remains the canonical repository-wide integration/final gate.

[targets.svmods.workflows]
validate = [
    {id = "core_purity", ref = "job:svmods-core-purity", depends_on = []},
    {id = "tests_sln", ref = "job:svmods-tests-sln", depends_on = ["core_purity"]},
]
[targets.nestcore]
runner = "dotnet"
platform = "desktop"
root = "."
solution = "NestCore/NestCore.csproj"
build_target = "NestCore/NestCore.csproj"
inputs = [
    "NestCore/**",
    ".devtool.toml",
]
outputs = [
    "NestCore/bin/**",
    "NestCore/obj/**",
]

[targets.nestcore.validation]
memory_guard_mb = 0
max_workers = 4
cpu_limit = 4
low_priority = false

[targets.nestcore.env]
GamePath = "/data/data/com.termux/files/home/stardew/game"

[targets.letmehatch]
runner = "dotnet"
platform = "desktop"
root = "."
solution = "LetMeHatch/LetMeHatch.csproj"
build_target = "LetMeHatch/LetMeHatch.csproj"
test_target = "Tests/LetMeHatch.Tests/LetMeHatch.Tests.csproj"
test_command = "./Tests/devtool/validate-letmehatch.sh"
inputs = [
    "LetMeHatch/**",
    "Tests/LetMeHatch*/**",
    ".devtool.toml",
]
outputs = [
    "LetMeHatch/bin/**",
    "LetMeHatch/obj/**",
    "Tests/LetMeHatch*/**/bin/**",
    "Tests/LetMeHatch*/**/obj/**",
]

[targets.letmehatch.validation]
memory_guard_mb = 0
max_workers = 4
cpu_limit = 4
low_priority = false

[targets.letmehatch.env]
GamePath = "/data/data/com.termux/files/home/stardew/game"
DOTNET_ROLL_FORWARD = "Major"

[targets.letmehatch.workflows]
validate = [
    {id = "core_purity", ref = "job:letmehatch-core-purity", depends_on = []},
    {id = "core_tests", ref = "job:letmehatch-core-tests", depends_on = ["core_purity"]},
    {id = "mod_tests", ref = "job:letmehatch-tests", depends_on = ["core_purity"]},
]
[targets.eggsinwild]
runner = "dotnet"
platform = "desktop"
root = "."
solution = "EggsInWild/EggsInWild.csproj"
build_target = "EggsInWild/EggsInWild.csproj"

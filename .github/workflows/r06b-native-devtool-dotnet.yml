# Opt-in R06b hosted-only native Devtool workflow. Never execute .NET on Termux.
# Source/DAG and test results are both validated; not a release qualification.
name: R06b native Devtool locked .NET tests (hosted)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r06b-native-dotnet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-locked-tests:
    name: Native Devtool locked restore and test (.NET 10 SDK, net6 target)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DEVTOOL_SOURCE_SHA: b164463db51e2cffd12f753043b9e55a08cc43ae
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      NUGET_PACKAGES: ${{ github.workspace }}/.ci-results/r06b/nuget
    steps:
      - name: Checkout exact consumer source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup .NET SDK 10 and net6 runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            10.0.x
      - name: Verify pinned consumer, SDK, and host environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f .devtool.toml
          test -f Tests/RoosterControl.PureTests/packages.lock.json
          test -f Tests/EggsInWild.AnimalNotes.Tests/packages.lock.json
          [[ "$(dotnet --version)" == 10.0.* ]]
          dotnet --list-runtimes | grep -Eq '^Microsoft\.NETCore\.App 6\.'
          mkdir -p "$RUNNER_TEMP/r06b-evidence" "$GITHUB_WORKSPACE/.ci-results/r06b"
      - name: Install Devtool from immutable revision
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/Mikeyphw/devtool.git "$RUNNER_TEMP/devtool-source"
          git -C "$RUNNER_TEMP/devtool-source" checkout --detach "$DEVTOOL_SOURCE_SHA"
          test "$(git -C "$RUNNER_TEMP/devtool-source" rev-parse HEAD)" = "$DEVTOOL_SOURCE_SHA"
          python3 -m venv "$RUNNER_TEMP/devtool-venv"
          "$RUNNER_TEMP/devtool-venv/bin/python" -m pip install --disable-pip-version-check "$RUNNER_TEMP/devtool-source"
      - name: Inspect native locked .NET job plan and preflight
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/devtool-venv/bin/python" -m devtool --repo "$GITHUB_WORKSPACE" plan ci-hosted-dotnet --target svmods --json > "$RUNNER_TEMP/r06b-evidence/plan.json"
          "$RUNNER_TEMP/devtool-venv/bin/python" -m devtool --repo "$GITHUB_WORKSPACE" preflight --target svmods --workflow ci-hosted-dotnet --json > "$RUNNER_TEMP/r06b-evidence/preflight.json"
      - name: Execute actual Devtool locked .NET job DAG
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/devtool-venv/bin/python" -m devtool --repo "$GITHUB_WORKSPACE" --machine-file "$RUNNER_TEMP/r06b-evidence/invoke.json" invoke --target svmods ci-hosted-dotnet
      - name: Verify Devtool job graph and both TRX test receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_r06b_native_dotnet.py \
            --repo "$GITHUB_WORKSPACE" \
            --evidence "$RUNNER_TEMP/r06b-evidence" \
            --consumer-sha "$GITHUB_SHA" \
            --devtool-sha "$DEVTOOL_SOURCE_SHA" \
            --receipt "$RUNNER_TEMP/r06b-evidence/receipt.json"
      - name: Preserve native receipts and checksums on failure too
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r06b-evidence"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/r06b-evidence/consumer-commit.txt"
          printf '%s\n' "$DEVTOOL_SOURCE_SHA" > "$RUNNER_TEMP/r06b-evidence/devtool-commit.txt"
          for file in r06b-pure.trx r06b-animalnotes.trx; do
            if test -f "$GITHUB_WORKSPACE/.ci-results/r06b/$file"; then
              cp "$GITHUB_WORKSPACE/.ci-results/r06b/$file" "$RUNNER_TEMP/r06b-evidence/$file"
            fi
          done
          (cd "$RUNNER_TEMP/r06b-evidence" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS)
      - name: Upload native execution evidence (not a release)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r06b-native-dotnet-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r06b-evidence/
          if-no-files-found: error
          retention-days: 14

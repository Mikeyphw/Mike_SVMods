name: DN03-FINAL portable .NET matrix (non-release)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dn03-final-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable_native:
    name: DN03-FINAL / ${{ matrix.host }} locked .NET tests (non-release)
    runs-on: ${{ matrix.host }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, windows-2022]
    env:
      CI_DEVTOOL_SHA: '5f66104bdc0751bcae3ecd20289d2912b7cf4ec3'
      CI_HOST_PROFILE: ${{ matrix.host }}
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - name: Checkout exact consumer event commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Isolate runner-local NuGet cache
        shell: pwsh
        run: |
          "NUGET_PACKAGES=$(Join-Path $env:RUNNER_TEMP 'dn03-final-nuget')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Fail-closed hosted source contract
        shell: pwsh
        run: |
          python scripts/dn03_final_source_contract.py
          if ($LASTEXITCODE -ne 0) { throw "DN03 final source contract failed" }
      - name: Pinned Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          check-latest: false
      - name: Install exact .NET SDKs and net6 runtime
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: |
            6.0.428
            10.0.100
          cache: false
      - name: Pin exact SDK selection in ephemeral checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Preserve the repository's tracked global.json (latestFeature).
          # SDK resolution is based on the dotnet process working directory,
          # so run the exact-version CLI from a dedicated temporary directory.
          $repoPolicyPath = Join-Path $env:GITHUB_WORKSPACE 'global.json'
          if (-not (Test-Path -LiteralPath $repoPolicyPath -PathType Leaf)) {
            throw 'Repository global.json is required and must not be replaced'
          }
          $repoPolicy = Get-Content -LiteralPath $repoPolicyPath -Raw | ConvertFrom-Json
          if ($repoPolicy.sdk.version -ne '10.0.100' -or $repoPolicy.sdk.allowPrerelease -ne $false) {
            throw 'Unexpected checked-in SDK policy'
          }
          $selectionDir = Join-Path $env:RUNNER_TEMP 'dn03-final-exact-sdk'
          New-Item -ItemType Directory -Path $selectionDir -Force | Out-Null
          $globalJson = Join-Path $selectionDir 'global.json'
          if (Test-Path -LiteralPath $globalJson) {
            throw 'Refusing to replace existing temporary SDK policy'
          }
          $sdkPolicy = '{"sdk":{"version":"10.0.100","rollForward":"disable","allowPrerelease":false}}'
          [System.IO.File]::WriteAllText($globalJson, $sdkPolicy + [Environment]::NewLine, [System.Text.UTF8Encoding]::new($false))
          $parsed = Get-Content -LiteralPath $globalJson -Raw | ConvertFrom-Json
          if ($parsed.sdk.version -ne '10.0.100' -or $parsed.sdk.rollForward -ne 'disable') {
            throw 'Temporary SDK policy did not round-trip'
          }
          Push-Location $selectionDir
          try {
            $selected = (dotnet --version).Trim()
            if ($LASTEXITCODE -ne 0 -or $selected -ne '10.0.100') {
              throw "Exact CI-only SDK selection failed: $selected"
            }
          } finally {
            Pop-Location
          }
          "CI_SDK_POLICY_DIR=$selectionDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'DN03_FINAL_EXACT_SDK_SELECTION_PINNED'
      - name: Verify SDK, runtime, source and pinned Devtool
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw "Checkout/source mismatch" }
          if ($env:GITHUB_REPOSITORY -ne 'Mikeyphw/Mike_SVMods') { throw "Repository mismatch" }
          if (-not $env:CI_SDK_POLICY_DIR) { throw 'Temporary SDK selector unavailable' }
          Push-Location $env:CI_SDK_POLICY_DIR
          try {
            $sdk = (dotnet --version).Trim()
            if ($LASTEXITCODE -ne 0 -or $sdk -ne '10.0.100') { throw "SDK 10.0.100 required" }
            $runtimes = (dotnet --list-runtimes) -join "`n"
            if ($LASTEXITCODE -ne 0 -or $runtimes -notmatch 'Microsoft\.NETCore\.App 6\.0\.36') {
              throw "Exact .NET 6.0.36 runtime required"
            }
          } finally {
            Pop-Location
          }
          $source = Join-Path $env:RUNNER_TEMP 'dn03-final-devtool'
          git clone --no-checkout https://github.com/Mikeyphw/devtool.git $source
          if ($LASTEXITCODE -ne 0) { throw "Devtool clone failed" }
          git -C $source checkout --detach $env:CI_DEVTOOL_SHA
          if ($LASTEXITCODE -ne 0) { throw "Pinned Devtool commit unavailable" }
          if ((git -C $source rev-parse HEAD).Trim() -ne $env:CI_DEVTOOL_SHA) { throw "Devtool pin mismatch" }
          if (-not (Test-Path (Join-Path $source 'devtool/actions_ci_qualification.py'))) {
            throw "Devtool portable verifier missing"
          }
          "CI_DEVTOOL_SOURCE=$source" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Execute both locked native test projects and verify typed TRX receipts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(
            @{ id='pure'; project='Tests/RoosterControl.PureTests/RoosterControl.PureTests.csproj'; count=21 },
            @{ id='animal'; project='Tests/EggsInWild.AnimalNotes.Tests/EggsInWild.AnimalNotes.Tests.csproj'; count=8 }
          )
          foreach ($t in $tests) {
            $dir = Join-Path $env:RUNNER_TEMP "dn03-final/$($t.id)"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            # Resolve SDK from the temporary policy, without changing the
            # consumer's root global.json or its tracked NuGet lock files.
            $projectPath = Join-Path $env:GITHUB_WORKSPACE $t.project
            if (-not (Test-Path -LiteralPath $projectPath -PathType Leaf)) {
              throw "Declared project missing: $($t.id)"
            }
            if (-not $env:CI_SDK_POLICY_DIR) { throw 'Temporary SDK selector unavailable' }
            Push-Location $env:CI_SDK_POLICY_DIR
            try {
              $selected = (dotnet --version).Trim()
              if ($LASTEXITCODE -ne 0 -or $selected -ne '10.0.100') {
                throw "SDK drift during tests: $selected"
              }
              dotnet restore $projectPath --locked-mode --no-http-cache
              if ($LASTEXITCODE -ne 0) { throw "Locked restore failed: $($t.id)" }
              dotnet test $projectPath --configuration Release --no-restore `
                --logger "trx;LogFileName=$($t.id).trx" --results-directory $dir
              if ($LASTEXITCODE -ne 0) { throw "Native tests failed: $($t.id)" }
            } finally {
              Pop-Location
            }
            $receiptDir = Join-Path $env:RUNNER_TEMP 'dn03-final/receipts'
            New-Item -ItemType Directory -Force -Path $receiptDir | Out-Null
            $receipt = Join-Path $receiptDir "$($env:CI_HOST_PROFILE)-$($t.id).json"
            $trxPath = Join-Path $dir "$($t.id).trx"
            Push-Location $env:CI_SDK_POLICY_DIR
            try {
              $sdk = (dotnet --version).Trim()
              if ($LASTEXITCODE -ne 0 -or $sdk -ne '10.0.100') { throw 'Evidence SDK identity drift' }
            } finally {
              Pop-Location
            }
            python (Join-Path $env:CI_DEVTOOL_SOURCE 'devtool/actions_ci_qualification.py') `
              review --source $env:GITHUB_SHA --devtool-sha $env:CI_DEVTOOL_SHA `
              --run-id $env:GITHUB_RUN_ID --attempt $env:GITHUB_RUN_ATTEMPT `
              --profile $env:CI_HOST_PROFILE --project $t.project --test-id $t.id `
              --trx $trxPath --expected-tests $t.count --sdk $sdk --output $receipt
            if ($LASTEXITCODE -ne 0) { throw "Typed TRX evidence refused: $($t.id)" }
          }
      - name: Upload original host-local test receipts (not remote authentication)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dn03-final-${{ matrix.host }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dn03-final/receipts/*.json
          if-no-files-found: error
          retention-days: 14

  final_gate:
    name: DN03-FINAL / Linux+Windows 58 TRX executions gate (non-release)
    needs: [portable_native]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI_DEVTOOL_SHA: '5f66104bdc0751bcae3ecd20289d2912b7cf4ec3'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require every matrix runner succeeded
        shell: bash
        env:
          CI_MATRIX_RESULT: ${{ needs.portable_native.result }}
        run: |
          set -euo pipefail
          test "$CI_MATRIX_RESULT" = success
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          check-latest: false
      - name: Download both uploaded receipt sets from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: dn03-final-*-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: true
          path: ${{ runner.temp }}/dn03-final-receipts
      - name: Reacquire exact Devtool source and reject incomplete matrix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git clone --no-checkout https://github.com/Mikeyphw/devtool.git "$RUNNER_TEMP/dn03-final-devtool"
          git -C "$RUNNER_TEMP/dn03-final-devtool" checkout --detach "$CI_DEVTOOL_SHA"
          test "$(git -C "$RUNNER_TEMP/dn03-final-devtool" rev-parse HEAD)" = "$CI_DEVTOOL_SHA"
          python3 "$RUNNER_TEMP/dn03-final-devtool/devtool/actions_ci_qualification.py" aggregate \
            --source "$GITHUB_SHA" --devtool-sha "$CI_DEVTOOL_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --receipts-dir "$RUNNER_TEMP/dn03-final-receipts" \
            --profiles ubuntu-24.04 windows-2022 \
            --test pure Tests/RoosterControl.PureTests/RoosterControl.PureTests.csproj 21 \
            --test animal Tests/EggsInWild.AnimalNotes.Tests/EggsInWild.AnimalNotes.Tests.csproj 8 \
            --output "$RUNNER_TEMP/dn03-final-aggregate.json"
          python3 -m json.tool "$RUNNER_TEMP/dn03-final-aggregate.json" >/dev/null
          echo 'DN03_FINAL_58_OF_58_CROSS_PLATFORM_GATE_PASS'
      - name: Upload cross-platform reviewed evidence (non-release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dn03-final-matrix-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dn03-final-aggregate.json
          if-no-files-found: error
          retention-days: 14

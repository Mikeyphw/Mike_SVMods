name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure-tests:
    name: Pure unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore Tests/RoosterControl.PureTests/RoosterControl.PureTests.csproj --locked-mode --no-http-cache

      - name: Test
        run: dotnet test Tests/RoosterControl.PureTests/RoosterControl.PureTests.csproj -c Release --no-restore

  animalnotes-locked:
    name: AnimalNotes locked restore and tests (SDK 10)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: .github/r05-sdk10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup .NET 10 SDK and .NET 6 runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            10.0.x
      - name: Confirm SDK and runtime
        run: |
          set -euo pipefail
          [[ "$(dotnet --version)" == 10.0.* ]]
          dotnet --list-runtimes | grep -Eq '^Microsoft\.NETCore\.App 6\.'
      - name: Restore in locked mode
        run: dotnet restore ../../Tests/EggsInWild.AnimalNotes.Tests/EggsInWild.AnimalNotes.Tests.csproj --locked-mode --no-http-cache
      - name: Test and record results
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.ci-results/r05c"
          dotnet test ../../Tests/EggsInWild.AnimalNotes.Tests/EggsInWild.AnimalNotes.Tests.csproj \
            -c Release --no-restore \
            --logger 'trx;LogFileName=eggsinwild-animalnotes-locked.trx' \
            --results-directory "$GITHUB_WORKSPACE/.ci-results/r05c"
          python3 ../../scripts/verify_dotnet_trx.py \
            --file "$GITHUB_WORKSPACE/.ci-results/r05c/eggsinwild-animalnotes-locked.trx" --min-executed 1
      - name: Upload locked test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r05c-animalnotes-locked-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-results/r05c/*.trx
          if-no-files-found: warn
          retention-days: 14

  source-contracts:
    name: SMAPI and Devtool source contracts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check SMAPI manifests
        run: python3 scripts/validate_mod_manifests.py
      - name: Exercise contract fixtures
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Verify affected target ownership contract
        run: python3 scripts/devtool_target_ownership.py --json
      - name: Verify target-local Devtool job contract
        run: python3 scripts/devtool_target_jobs.py --json
      - name: Verify hosted SDK 10 qualification workflow
        run: python3 scripts/check_hosted_dotnet_policy.py
      - name: Verify R05b hosted NuGet lock candidate policy
        run: python3 scripts/check_nuget_candidate_policy.py
      - name: Verify committed NuGet locks and locked-mode CI
        run: python3 scripts/check_committed_nuget_locks.py
      - name: Verify R06a hosted Devtool native gate source contract
        run: python3 scripts/check_r06_source_contract.py
      - name: Verify hosted R06b native locked .NET workflow policy
        run: python3 scripts/check_r06b_source_contract.py
      - name: Check Devtool and CI source contract
        run: python3 scripts/devtool_actions_contract.py

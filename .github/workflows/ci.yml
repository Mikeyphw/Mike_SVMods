name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure-tests:
    name: Pure unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore Tests/RoosterControl.PureTests/RoosterControl.PureTests.csproj

      - name: Test
        run: dotnet test Tests/RoosterControl.PureTests/RoosterControl.PureTests.csproj -c Release --no-restore

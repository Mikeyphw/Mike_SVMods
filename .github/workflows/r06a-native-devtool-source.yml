# R06a source-only hosted Devtool qualification. Opt-in until acceptance.
# Devtool source is frozen at a reviewed Git commit; baseline .NET CI is separate.
name: R06a native Devtool source DAG (hosted)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r06a-native-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-devtool-source:
    name: Pinned Devtool plan, preflight, and invoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEVTOOL_SOURCE_SHA: b164463db51e2cffd12f753043b9e55a08cc43ae
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact consumer source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify consumer identity and create evidence directory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f .devtool.toml
          mkdir -p "$RUNNER_TEMP/r06-evidence"
      - name: Install Devtool from immutable source revision
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/Mikeyphw/devtool.git "$RUNNER_TEMP/devtool-source"
          git -C "$RUNNER_TEMP/devtool-source" checkout --detach "$DEVTOOL_SOURCE_SHA"
          test "$(git -C "$RUNNER_TEMP/devtool-source" rev-parse HEAD)" = "$DEVTOOL_SOURCE_SHA"
          python3 -m venv "$RUNNER_TEMP/devtool-venv"
          "$RUNNER_TEMP/devtool-venv/bin/python" -m pip install --disable-pip-version-check "$RUNNER_TEMP/devtool-source"
      - name: Inspect native source-only plan and preflight
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/devtool-venv/bin/python" -m devtool --repo "$GITHUB_WORKSPACE" plan ci-preflight --target svmods --json > "$RUNNER_TEMP/r06-evidence/plan.json"
          "$RUNNER_TEMP/devtool-venv/bin/python" -m devtool --repo "$GITHUB_WORKSPACE" preflight --target svmods --workflow ci-preflight --json > "$RUNNER_TEMP/r06-evidence/preflight.json"
      - name: Execute native Devtool source workflow
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/devtool-venv/bin/python" -m devtool --repo "$GITHUB_WORKSPACE" --machine-file "$RUNNER_TEMP/r06-evidence/invoke.json" invoke --target svmods ci-preflight
      - name: Validate native execution evidence (fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_r06_native_evidence.py \
            --evidence "$RUNNER_TEMP/r06-evidence" \
            --consumer-sha "$GITHUB_SHA" \
            --devtool-sha "$DEVTOOL_SOURCE_SHA" \
            --receipt "$RUNNER_TEMP/r06-evidence/receipt.json"
      - name: Stage evidence and checksums (even if failed)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r06-evidence"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/r06-evidence/consumer-commit.txt"
          printf '%s\n' "$DEVTOOL_SOURCE_SHA" > "$RUNNER_TEMP/r06-evidence/devtool-commit.txt"
          (cd "$RUNNER_TEMP/r06-evidence" && sha256sum ./*.json ./*.txt 2>/dev/null > SHA256SUMS || true)
      - name: Publish actual hosted Devtool evidence (not a release)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r06a-native-devtool-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r06-evidence/
          if-no-files-found: error
          retention-days: 14

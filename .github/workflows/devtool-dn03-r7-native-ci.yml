# Generated by Devtool RM-06: multi-job projection of the native DAG.
# ExportGraphV2 SHA256: ${{ needs.r7_plan.outputs.graph_sha }}
name: DN03-R7 native .NET CI (29 tests, non-release)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: dn03-r7-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  r7_plan:
    name: DN03-R7 / source-admitted graph (non-release)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      graph_sha: ${{ steps.plan.outputs.graph_sha }}
    steps:
      - name: Checkout exact consumer commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Pinned Python interpreter
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Compile and admit immutable six-node graph
        id: plan
        shell: bash
        env:
          DEVTOOL_SOURCE_SHA: '0ebd22c17ac3058704012a1e03ee3265328b0659'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git clone --no-checkout https://github.com/Mikeyphw/devtool.git "$RUNNER_TEMP/r7-devtool"
          git -C "$RUNNER_TEMP/r7-devtool" checkout --detach "$DEVTOOL_SOURCE_SHA"
          test "$(git -C "$RUNNER_TEMP/r7-devtool" rev-parse HEAD)" = "$DEVTOOL_SOURCE_SHA"
          python3 -m venv "$RUNNER_TEMP/r7-venv"
          "$RUNNER_TEMP/r7-venv/bin/python" -m pip install --disable-pip-version-check "$RUNNER_TEMP/r7-devtool"
          "$RUNNER_TEMP/r7-venv/bin/python" - <<'R7_PLAN_PY'
          import os
          import re
          from pathlib import Path
          from devtool.actions_graph_export import compile_graph
          sha = os.environ['DEVTOOL_SOURCE_SHA']
          graph = compile_graph(Path(os.environ['GITHUB_WORKSPACE']), target='dn03_r5',
              workflow='native_r6', devtool_sha=sha,
              host_profiles='ubuntu-24.04-x64', cache_locks=False)
          nodes = graph['jobs']
          expected = [
              ('node-01','restore_pure','restore',[],[]),
              ('node-02','build_pure','build',['node-01'],[]),
              ('node-03','test_pure','test',['node-02'],['dist/pure/results.trx']),
              ('node-04','restore_animal','restore',['node-03'],[]),
              ('node-05','build_animal','build',['node-04'],[]),
              ('node-06','test_animal','test',['node-05'],['dist/animal/results.trx']),
          ]
          assert len(nodes) == len(expected), 'R7 native job count drifted'
          for job, (jid, jobname, cmd, dependencies, outputs) in zip(nodes, expected):
              assert job['id'] == jid and job['job'] == jobname, 'R7 native job identity drift'
              assert job['provider'] == 'dotnet' and job['profile_id'] == 'ubuntu-24.04-x64'
              assert job['dotnet_command'] == cmd and job['needs'] == dependencies
              assert job['outputs'] == outputs, 'R7 native output ownership drift'
          digest = graph['graph_sha256']
          assert re.fullmatch(r'[0-9a-f]{64}', digest)
          assert graph['runtime_sha'] == sha
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('graph_sha='+digest+'\n')
          print('DN03_R7_SOURCE_GRAPH_ADMITTED='+digest)
          R7_PLAN_PY
  node-01:
    needs: [r7_plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DEVTOOL_SOURCE_SHA: 0ebd22c17ac3058704012a1e03ee3265328b0659
      PYTHONDONTWRITEBYTECODE: "1"
      GOTOOLCHAIN: local
      RUSTUP_AUTO_INSTALL: "0"
      CARGO_NET_OFFLINE: "true"
    steps:
      - name: Checkout consumer commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Bind runner-local tool stores
        shell: bash
        run: |
          set -euo pipefail
          printf "NUGET_PACKAGES=%s\n" "$RUNNER_TEMP/devtool-nuget-store" >> "$GITHUB_ENV"
          printf "PIP_CACHE_DIR=%s\n" "$RUNNER_TEMP/devtool-python-wheel-store" >> "$GITHUB_ENV"
      - name: Pinned Python interpreter
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: DN03 bind isolated exact .NET SDK installation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dn03-dotnet"
          printf 'DOTNET_INSTALL_DIR=%s\n' "$RUNNER_TEMP/dn03-dotnet" >> "$GITHUB_ENV"
      - name: Pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.100'
          cache: false
      - name: Acquire immutable Devtool runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git clone --no-checkout https://github.com/Mikeyphw/devtool.git "$RUNNER_TEMP/devtool-source"
          git -C "$RUNNER_TEMP/devtool-source" checkout --detach "$DEVTOOL_SOURCE_SHA"
          test "$(git -C "$RUNNER_TEMP/devtool-source" rev-parse HEAD)" = "$DEVTOOL_SOURCE_SHA"
          python3 -m venv "$RUNNER_TEMP/devtool-venv"
          "$RUNNER_TEMP/devtool-venv/bin/python" -m pip install --disable-pip-version-check "$RUNNER_TEMP/devtool-source"
      - name: DN03 install SHA-512-pinned .NET 6 runtime only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dn03-host/node-01"
          "$RUNNER_TEMP/devtool-venv/bin/python" -m devtool.dn03_runtime_only install --download --archive "$RUNNER_TEMP/dn03-runtime-6.0.36-linux-x64.tar.gz" --dotnet-root "$DOTNET_INSTALL_DIR" --receipt "$RUNNER_TEMP/dn03-host/node-01/runtime.json"
          dotnet --list-runtimes | grep -F 'Microsoft.NETCore.App 6.0.36 ['
      - name: DN03 verify .NET host and record local source-bound evidence
        shell: bash
        env:
          DN03_NODE: 'node-01'
          DN03_EXPECTED_SDK: '10.0.100'
          DN03_EXPECTED_RUNTIME: '6.0.36'
          DN03_GRAPH_SHA: '${{ needs.r7_plan.outputs.graph_sha }}'
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true
          test "${RUNNER_OS:-}" = Linux
          test "${RUNNER_ARCH:-}" = X64
          test "$DEVTOOL_SOURCE_SHA" = '0ebd22c17ac3058704012a1e03ee3265328b0659'
          test "$(dotnet --version)" = "$DN03_EXPECTED_SDK"
          if test -n "$DN03_EXPECTED_RUNTIME"; then
            dotnet --list-runtimes | awk -v v="$DN03_EXPECTED_RUNTIME" '
              $1 == "Microsoft.NETCore.App" && $2 == v { seen++ }
              END { exit(seen == 1 ? 0 : 1) }'
          fi
          mkdir -p "$RUNNER_TEMP/dn03-host/$DN03_NODE"
          python3 - <<'PY'
          import json, os, pathlib, re
          e = os.environ
          sha = e.get('GITHUB_SHA', '')
          assert re.fullmatch(r'[0-9a-f]{40}', sha)
          run = e.get('GITHUB_RUN_ID', '')
          attempt = e.get('GITHUB_RUN_ATTEMPT', '')
          assert run.isdecimal() and attempt.isdecimal()
          assert int(run) > 0 and int(attempt) > 0
          value = {'kind':'devtool.dn03-host-review',
                   'source_sha':sha,
                   'devtool_sha':e['DEVTOOL_SOURCE_SHA'],
                   'graph_sha256':e['DN03_GRAPH_SHA'],
                   'node':e['DN03_NODE'],
                   'sdk':e['DN03_EXPECTED_SDK'],
                   'legacy_runtime':e['DN03_EXPECTED_RUNTIME'],
                   'run_id':int(run),'run_attempt':int(attempt),
                   'runtime_inventory_checked':True,
                   'hosted_authenticated':False,
                   'release_qualified':False}
          if e['DN03_EXPECTED_RUNTIME']:
              from hashlib import sha256
              runtime = pathlib.Path(e['RUNNER_TEMP'])/'dn03-host'/e['DN03_NODE']/'runtime.json'
              raw = runtime.read_bytes()
              installed = json.loads(raw)
              assert installed.get('archive_sha512') == 'afb6018fcabec468ccd7ae2f1131d8c9de7f4de7645b8f0c223efbbdbfdc515fb0642a399ebfe372c02044416c4cae463c9c802cd156b9da4181efff0e33ee94'
              assert installed.get('runtime') == e['DN03_EXPECTED_RUNTIME']
              assert installed.get('sdk_installed_by_this_provisioner') is False
              value['runtime_receipt_sha256'] = sha256(raw).hexdigest()
          out = pathlib.Path(e['RUNNER_TEMP'])/'dn03-host'/e['DN03_NODE']/'host.json'
          with out.open('x', encoding='utf-8') as f:
              json.dump(value, f, sort_keys=True, indent=2)
              f.write('\n')
          PY
      - name: Verify dependencies and run native target-local node
        id: sfdt_native
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/devtool-venv/bin/python" -m devtool.actions_graph_export run-node --root "$GITHUB_WORKSPACE" --target dn03_r5 --workflow native_r6 --devtool-sha 0ebd22c17ac3058704012a1e03ee3265328b0659 --graph-sha ${{ needs.r7_plan.outputs.graph_sha }} --job-id node-01  --host-profiles ubuntu-24.04-x64 --inputs "$RUNNER_TEMP/rm06-inputs" --outputs "$RUNNER_TEMP/rm06-output"
      - name: DN03-R3 reverify native .NET node, host and output bytes
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true
          test "${RUNNER_OS:-}" = Linux
          test "${RUNNER_ARCH:-}" = X64
          test "$DEVTOOL_SOURCE_SHA" = "0ebd22c17ac3058704012a1e03ee3265328b0659"
          "$RUNNER_TEMP/devtool-venv/bin/python" -m devtool.actions_dn03_r3_verify verify-node \
            --repo "$GITHUB_WORKSPACE" \
            --target dn03_r5 --workflow native_r6 \
            --devtool-sha 0ebd22c17ac3058704012a1e03ee3265328b0659 --graph-sha ${{ needs.r7_plan.outputs.graph_sha }} \
            --job-id node-01 \
            --outputs "$RUNNER_TEMP/rm06-output"
      - name: Record local run attempt (not authentication)
        if: always()
        shell: bash
        env:
          SFDT_NATIVE_OUTCOME: ${{ steps.sfdt_native.outcome }}
          SFDT_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rm06-evidence/node-01"
          printf "%s\n" "$GITHUB_SHA/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/node-01" > "$RUNNER_TEMP/rm06-evidence/node-01/source-run.txt"
          python3 -B - <<'SFDT05_ATTEMPT'
          import hashlib, json, os, pathlib, subprocess, sys
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"rm06-evidence"/'node-01'
          out.mkdir(parents=True,exist_ok=True)
          expected=os.environ.get("GITHUB_SHA","")
          p=subprocess.run(["git","rev-parse","HEAD"],capture_output=True,text=True,check=False)
          source_ok=p.returncode==0 and p.stdout.strip()==expected
          native=os.environ.get("SFDT_NATIVE_OUTCOME","")
          job_status=os.environ.get("SFDT_JOB_STATUS","")
          node=out/"node-evidence.json"
          evidence_present=node.is_file() and not node.is_symlink() and 0<node.stat().st_size<=131072
          complete=source_ok and native=="success" and job_status=="success" and evidence_present
          data=dict(schema_version=1,kind="devtool.actions.hosted-node-attempt",
            source_commit=expected,source_checkout_matched=source_ok,
            runtime_sha='0ebd22c17ac3058704012a1e03ee3265328b0659',graph_sha256='${{ needs.r7_plan.outputs.graph_sha }}',
            run_id=os.environ.get("GITHUB_RUN_ID",""),
            attempt=os.environ.get("GITHUB_RUN_ATTEMPT",""),
            job_id='node-01',native_step_outcome=native,job_status=job_status,
            typed_node_evidence_present=evidence_present,
            status="OBSERVED_SUCCESS" if complete else "UNQUALIFIED",
            authenticated_remote=False,release_qualified=False)
          blob=json.dumps(data,sort_keys=True,separators=(",",":"),ensure_ascii=True).encode()
          data["receipt_sha256"]=hashlib.sha256(blob).hexdigest()
          with (out/"attempt-evidence.json").open("x",encoding="utf-8") as handle:
            json.dump(data,handle,sort_keys=True,indent=2)
            handle.write("\n")
          if not complete: print("SFDT05_ATTEMPT_UNQUALIFIED: inspect failed/absent native node evidence",file=sys.stderr)
          if native=="success" and not complete: sys.exit(7)
          SFDT05_ATTEMPT
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: devtool-dn03_r5-native_r6-multi-node-01-evidence
          path: ${{ runner.temp }}/rm06-evidence/node-01/
          if-no-files-found: error
          retention-days: 7
      - name: DN03 preserve local host review (non-release)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dn03-host-node-01-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dn03-host/node-01/
          if-no-files-found: error
          retention-days: 14

      - name: DN03-R4 cross-check all same-run native node receipts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          "$RUNNER_TEMP/dn03-r4-venv/bin/python" -m devtool.actions_dn03_r4_verify verify-workflow \
            --repo "$GITHUB_WORKSPACE" \
            --target dn03_r5 --workflow native_r6 \
            --devtool-sha 0ebd22c17ac3058704012a1e03ee3265328b0659 --graph-sha ${{ needs.r7_plan.outputs.graph_sha }} \
            --evidence "$RUNNER_TEMP/dn03-r4"
      - name: R7 fail-closed 29-test acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R7_ACCEPT_PY'
          import json
          import os
          import re
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'dn03-r4/acceptance.json'
          assert p.is_file() and not p.is_symlink() and 0 < p.stat().st_size < 262144
          a=json.loads(p.read_text(encoding='utf-8'))
          assert a['kind'] == 'devtool.dn03-r4-cross-node-review'
          assert a['consumer_repository'] == os.environ['GITHUB_REPOSITORY']
          assert a['consumer_source_sha'] == os.environ['GITHUB_SHA']
          assert a['devtool_sha'] == os.environ['DEVTOOL_SOURCE_SHA']
          assert a['graph_sha256'] == os.environ['DN03_R4_GRAPH_SHA']
          assert a['run_id'] == int(os.environ['GITHUB_RUN_ID'])
          assert a['run_attempt'] == int(os.environ['GITHUB_RUN_ATTEMPT'])
          assert a['node_count'] == 6 and a['native_dag_passed'] is True
          assert a['all_declared_outputs_verified'] is True
          assert a['test_reports_independently_verified'] is True
          assert a['verified_test_node_count'] == 2
          assert a['verified_test_case_count'] == 29
          assert a['remote_authenticated'] is False and a['release_qualified'] is False
          nodes=a['nodes']
          assert len(nodes)==6 and {x['job_id'] for x in nodes}=={f'node-{i:02}' for i in range(1,7)}
          expected={'node-03':('dist/pure/results.trx',21), 'node-06':('dist/animal/results.trx',8)}
          for node in nodes:
              jid=node['job_id']
              trx=node['verified_trx']
              if jid not in expected:
                  assert trx is None
                  continue
              path,total=expected[jid]
              assert trx['path']==path and trx['passed']==total
              tests=trx['tests']
              assert tests['format']=='trx' and tests['total']==total
              assert tests['failed']==0 and tests['skipped']==0 and tests['required'] is True
              assert re.fullmatch('[0-9a-f]{64}',trx['sha256'])
              assert tests['report_sha256']==trx['sha256']
              assert trx['remote_authenticated'] is False and trx['release_qualified'] is False
          print('DN03_R7_29_OF_29_TYPED_TRX_GATE_PASS')
          R7_ACCEPT_PY
      - name: Seal available evidence even on failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dn03-r4"
          (cd "$RUNNER_TEMP/dn03-r4" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS)
      - name: Upload non-release R4 cross-node review receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dn03-r4-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dn03-r4/acceptance.json
            ${{ runner.temp }}/dn03-r4/source-run.txt
            ${{ runner.temp }}/dn03-r4/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14

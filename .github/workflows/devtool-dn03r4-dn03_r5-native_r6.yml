            --target dn03_r5 --workflow native_r6 \
            --devtool-sha 0ebd22c17ac3058704012a1e03ee3265328b0659 --graph-sha 1f0cca4f8e611069946d82cc37ba1f371a72e26cbbba7c03864386abb25c04c0 \
            --evidence "$RUNNER_TEMP/dn03-r4"
      - name: Seal available evidence even on failure
        if: always()

          python3 -B - <<'SFDT05_ATTEMPT'
          import hashlib, json, os, pathlib, subprocess, sys
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"rm06-evidence"/'node-01'
          out.mkdir(parents=True,exist_ok=True)
